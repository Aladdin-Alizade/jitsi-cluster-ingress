# JITSI_15_USERS — Jicofo (live server + Jibri brewery)

jicofo {
    conference {
        max-participants = 15
        # Keep true without JWT so the teacher (first joiner) can record / endConference.
        # Portal calls endConference on moderator leave so ownership is not handed to students.
        enable-auto-owner = true
        strip-simulcast = false
    }
    bridge {
        selection-strategy = SplitBridgeSelectionStrategy
        stress-threshold = 0.8
    }
}
